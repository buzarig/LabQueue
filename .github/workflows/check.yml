# CI: та сама брама, що й pre-push (ADR-0015). Уся логіка — у Makefile.
# З лаби 2 make check потребує PostgreSQL 17 — цільова версія (ADR-0032).
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          # Одноразовий контейнер CI: пароль не секрет (MAN-06).
          POSTGRES_USER: labqueue
          POSTGRES_PASSWORD: labqueue-ci
          POSTGRES_DB: labqueue_dev
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U labqueue"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://labqueue:labqueue-ci@127.0.0.1:55432/labqueue_dev
    steps:
      - uses: actions/checkout@v4
        with:
          # CHK-07/08 перевіряють історію origin/main..HEAD.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: make check
